---
- name: run a demo web page 
  hosts: webservers
  become: true  
  tasks: 

    - name: install apache 
      ansible.builtin.dnf: 
                     name: httpd
                     state: present

    - name: make sure index.html is present
      ansible.builtin.copy: 
                       src: files/index.html
                       dest: /var/www/html/index.html
                      
    - name: start and enable apache
      ansible.builtin.service: 
                          name: httpd
                          state: started   
                          enabled: true      
